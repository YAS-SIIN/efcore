name: Publish NuGet Package

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Setup .NET environment
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0' # Adjust based on your project

      # Step 3: Restore dependencies
      - name: Restore dependencies
        run: ./restore.sh

      # Step 4: Build the project
      - name: Build
        run: ./build.sh

       # Step 5: Pack the project
      - name: Pack
        run: dotnet pack src/EFCore.SharePoint/EFCore.SharePoint.csproj --configuration Release -o ./packages

       # Step 6a: Add GitHub Packages as a NuGet source
      - name: Add GitHub Packages source
        run: dotnet nuget add source --username YAS-SIIN --password ${{ secrets.FOR_NUGETPACKAGE }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/YAS-SIIN/index.json"

       # Step 6b: Publish package to GitHub Packages
      - name: Publish to GitHub Packages
        run: dotnet nuget push ./packages/*.nupkg --source github --skip-duplicate
